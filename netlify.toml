# Netlify can't run PHP, so the site is rendered to plain HTML at deploy time (see build.php).

[build]
  command = "php build.php"
  publish = "dist"

[build.environment]
  PHP_VERSION = "8.3"

# The old catalogue
[[redirects]]
  from = "/products/*"
  to = "/business-cards/"
  status = 301

[[redirects]]
  from = "/products"
  to = "/business-cards/"
  status = 301

# Section URLs live without a trailing slash (relative links depend on it)

[[redirects]]
  from = "/how-to-order/"
  to = "/how-to-order"
  status = 301

# Old addresses
[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

[[redirects]]
  from = "/:page/index.php"
  to = "/:page/"
  status = 301

[[redirects]]
  from = "/products.html"
  to = "/business-cards/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
