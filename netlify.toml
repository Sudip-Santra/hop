# Netlify can't run PHP, so the site is rendered to plain HTML at deploy time (see build.php).

[build]
  command = "php build.php"
  publish = "dist"

[build.environment]
  PHP_VERSION = "8.3"

# The old catalogue
[[redirects]]
  from = "/products/*"
  to = "/business-cards/"
  status = 301

[[redirects]]
  from = "/products"
  to = "/business-cards/"
  status = 301

# The old How to order section: its address goes to the home page
[[redirects]]
  from = "/how-to-order"
  to = "/"
  status = 301

[[redirects]]
  from = "/how-to-order/"
  to = "/"
  status = 301

# Old addresses
[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

[[redirects]]
  from = "/:page/index.php"
  to = "/:page/"
  status = 301

[[redirects]]
  from = "/products.html"
  to = "/business-cards/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/institution/"
  status = 301

# About became The Institution, and the Gallery became The Works
[[redirects]]
  from = "/about/*"
  to = "/institution/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/institution/"
  status = 301

[[redirects]]
  from = "/gallery/*"
  to = "/works/"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/works/"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
